name: Validate cask

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-cask:
    name: validate-cask
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Check Ruby syntax
        run: |
          recipe_directories=(Casks)
          if [ -d Formula ]; then
            recipe_directories+=(Formula)
          fi
          find "${recipe_directories[@]}" -name '*.rb' -type f -print0 | \
            xargs -0 -n1 ruby -c

      - name: Tap local repository
        run: brew tap jansim/tools "$GITHUB_WORKSPACE"

      # Homebrew ignores the casks of an untrusted tap, so readall would
      # otherwise pass without loading them.
      - name: Trust local tap
        run: brew trust jansim/tools

      # readall exits 0 when a cask uses deprecated DSL, so fail on any warning.
      - name: Check Homebrew can load the tap without warnings
        run: |
          brew readall jansim/tools 2>&1 | tee "$RUNNER_TEMP/readall.log"
          if grep -qE '^(::warning|Warning:)' "$RUNNER_TEMP/readall.log"; then
            echo "::error::brew readall emitted warnings"
            exit 1
          fi

      # Cask/Url exempts GitHub release assets under releases/download but not
      # the releases/latest/download alias the cask uses, and brew style
      # rejects rubocop:disable comments, so skip that cop here.
      - name: Check Homebrew style
        run: brew style --except-cops Cask/Url jansim/tools
