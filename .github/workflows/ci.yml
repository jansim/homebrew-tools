name: CI

# Installs every cask from this checkout, the way people install it, and checks that the app comes
# out of quarantine, then uninstalls it again.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    # Same-repo branches already run on push; only fork PRs need this event.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: macos-26
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - { cask: apple-calendar-custom-url, app: CustomCalendarURL }
          - { cask: smol-pdf, app: smol-pdf, check: smolpdf --help }
          - { cask: doctopus, app: Doctopus }

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      CASK: jansim/tools/${{ matrix.cask }}

    steps:
      - uses: actions/checkout@v4

      # As in the README, with this checkout as the tap. Installing by full name trusts the cask.
      - name: Tap
        run: |
          brew --version
          brew tap jansim/tools "$GITHUB_WORKSPACE"
          brew style --cask "$CASK"

      # A cask can be added before its app has a release with the file it downloads.
      - name: Check for a release
        id: release
        run: |
          url=$(brew info --json=v2 --cask "$CASK" | jq -r '.casks[0].url')
          if curl -fsIL -o /dev/null "$url"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release at $url yet, so ${{ matrix.cask }} is not installed"
          fi

      - name: Audit
        if: steps.release.outputs.exists
        run: brew audit --cask --strict --online "$CASK"

      - name: Install
        if: steps.release.outputs.exists
        run: brew install --cask "$CASK"

      - name: Check
        if: steps.release.outputs.exists
        run: |
          if xattr -r "/Applications/${{ matrix.app }}.app" | grep com.apple.quarantine; then
            echo "::error::The app is still quarantined"
            exit 1
          fi
          ${{ matrix.check }}

      - name: Uninstall
        if: steps.release.outputs.exists
        run: |
          brew uninstall --cask --zap "${{ matrix.cask }}"
          [ ! -e "/Applications/${{ matrix.app }}.app" ]
